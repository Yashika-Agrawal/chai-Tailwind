<!DOCTYPE html>
<html>
<head>
  <title>Chai CSS Demo</title>
</head>

<body class="chai_p-6 chai_bg-[#d0ad90]">

  <!-- CONTAINER -->
  <div class="chai_maxw-xl chai_mx-auto">

    <!-- HEADER -->
    <div class="chai_mb-6">
      <h1 class="chai_fs-xl chai_fw-bold chai_text-[#6f4e37]">
        ☕ Chai CSS
      </h1>
      <p class="chai_text-[#9c6644]">
        Utility-first CSS built from scratch 🚀
      </p>
    </div>

    <!-- FONT SIZE -->
    <div class="chai_mb-6">

      <h2 class="chai_fs-lg chai_fw-bold chai_mb-3">Font Sizes</h2>
    
      <div class="chai_flex chai_flexwrap-wrap chai_gap-md">
    
        <div class="
          chai_p-4 
          chai_bg-white 
          chai_shadow-md 
          chai_rounded-lg 
          chai_w-third
        ">
          <div class="chai_fs-sm">Small</div>
          <div class="chai_text-[#9c6644]">chai_fs-sm</div>
        </div>
    
        <div class="
          chai_p-4 
          chai_bg-white 
          chai_shadow-md 
          chai_rounded-lg 
          chai_w-third
        ">
          <div class="chai_fs-lg">Large</div>
          <div class="chai_text-[#9c6644]">chai_fs-lg</div>
        </div>
    
        <div class="
          chai_p-4 
          chai_bg-white 
          chai_shadow-md 
          chai_rounded-lg 
          chai_w-third
        ">
          <div class="chai_fs-xl">XL</div>
          <div class="chai_text-[#9c6644]">chai_fs-xl</div>
        </div>
    
      </div>
    
    </div>

    <!-- COLORS -->
    <div class="chai_mb-6">

      <h2 class="chai_fs-lg chai_fw-bold chai_mb-3">Colors</h2>
    
      <div class="chai_flex chai_gap-md chai_flexwrap-wrap">
    
        <div class="chai_p-4 chai_bg-blue chai_text-white chai_rounded-lg chai_w-third">
          bg-blue
        </div>
    
        <div class="chai_p-4 chai_bg-red chai_text-white chai_rounded-lg chai_w-third">
          bg-red
        </div>
    
        <div class="chai_p-4 chai_bg-[#6f4e37] chai_text-white chai_rounded-lg chai_w-third">
          chai color
        </div>
    
      </div>
    
    </div>
<!-- SHADOW SECTION -->
<div class="chai_mb-6">

  <h2 class="chai_fs-lg chai_fw-bold chai_mb-3">Shadows</h2>

  <div class="chai_flex chai_gap-md chai_flexwrap-wrap">

    <div class="chai_p-4 chai_bg-white chai_shadow-sm chai_rounded-lg chai_w-third">
      shadow-sm
    </div>

    <div class="chai_p-4 chai_bg-white chai_shadow-md chai_rounded-lg chai_w-third">
      shadow-md
    </div>

    <div class="chai_p-4 chai_bg-white chai_shadow-lg chai_rounded-lg chai_w-third">
      shadow-lg
    </div>

  </div>

</div>

    <!-- BORDER RADIUS -->
    <div class="chai_mb-6">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-2">Border Radius</h2>

      <div class="chai_flex chai_gap-md">
        <div class="chai_p-4 chai_bg-gray chai_rounded-sm">
          rounded-sm
        </div>

        <div class="chai_p-4 chai_bg-gray chai_rounded-lg">
          rounded-lg
        </div>

        <div class="chai_p-4 chai_bg-black chai_text-white chai_rounded-full">
          rounded-full
        </div>
      </div>
    </div>

    <!-- WIDTH -->
    <div class="chai_mb-6">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-2">Width</h2>

      <div class="chai_flex chai_gap-md chai_flexwrap-wrap">

        <div class="chai_p-4 chai_bg-gray chai_w-third">
          w-full
        </div>
      
        <div class="chai_p-4 chai_bg-gray chai_w-third">
          w-half
        </div>
      
      </div>
    </div>

    <!-- SPACING -->
    <div class="chai_mb-6">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-2">Spacing</h2>

      <div class="chai_flex chai_gap-md">
        <div class="chai_p-2 chai_bg-white chai_rounded-md">p-2</div>
        <div class="chai_p-4 chai_bg-white chai_rounded-md">p-4</div>
        <div class="chai_p-6 chai_bg-white chai_rounded-md">p-6</div>
      </div>
    </div>

    <!-- BUTTON -->
    <div class="chai_mb-6">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-2">Button</h2>

      <button class="
        chai_p-3
        chai_bg-[#6f4e37]
        chai_text-white
        chai_rounded-md
        chai_shadow-md
      ">
        Click Me ☕
      </button>
    </div>

  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
