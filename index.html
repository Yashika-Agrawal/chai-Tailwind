<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chai CSS — Kitchen Sink Demo</title>
</head>

<body class="chai_bg-[#fdf8f3] chai_p-6" style="margin: 0; min-height: 100vh; font-family: sans-serif;">

  <div class="chai_display-block chai_maxw-xl chai_ml-auto chai_p-8" style="margin-right: auto;">

    <header class="chai_mb-12 chai_ta-center">
      <span class="chai_bg-[#6f4e37] chai_text-white chai_pt-1 chai_pb-1 chai_pl-3 chai_pr-3 chai_rounded-full chai_fs-sm">
        Framework Showcase ☕
      </span>
      <h1 class="chai_fs-xl chai_fw-bold chai_text-[#6f4e37] chai_mt-4">Chai CSS Capabilities</h1>
    </header>

    <section class="chai_mb-12">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-6 chai_text-[#6f4e37]">01. Color Palette</h2>
      <div class="chai_flex chai_gap-4 chai_flexwrap-wrap">
        <div class="chai_ta-center">
          <div class="chai_bg-blue chai_w-16 chai_h-16 chai_rounded-md chai_mb-2 chai_shadow-sm"></div>
          <span class="chai_fs-sm chai_text-gray">Blue</span>
        </div>
        <div class="chai_ta-center">
          <div class="chai_bg-red chai_w-16 chai_h-16 chai_rounded-md chai_mb-2 chai_shadow-sm"></div>
          <span class="chai_fs-sm chai_text-gray">Red</span>
        </div>
        <div class="chai_ta-center">
          <div class="chai_bg-yellow chai_w-16 chai_h-16 chai_rounded-md chai_mb-2 chai_shadow-sm"></div>
          <span class="chai_fs-sm chai_text-gray">Yellow</span>
        </div>
        <div class="chai_ta-center">
          <div class="chai_bg-black chai_w-16 chai_h-16 chai_rounded-md chai_mb-2 chai_shadow-sm"></div>
          <span class="chai_fs-sm chai_text-gray">Black</span>
        </div>
        <div class="chai_ta-center">
          <div class="chai_bg-[#6f4e37] chai_w-16 chai_h-16 chai_rounded-md chai_mb-2 chai_shadow-sm"></div>
          <span class="chai_fs-sm chai_text-gray">Chai</span>
        </div>
      </div>
    </section>

    <section class="chai_mb-12">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-4 chai_text-[#6f4e37]">02. Spacing Scale (n * 4px)</h2>
      <div class="chai_flex chai_flexcol chai_gap-2">
        <div class="chai_bg-[#6f4e37] chai_h-4 chai_w-4 chai_rounded-sm"></div>
        <div class="chai_bg-[#6f4e37] chai_h-4 chai_w-8 chai_rounded-sm"></div>
        <div class="chai_bg-[#6f4e37] chai_h-4 chai_w-16 chai_rounded-sm"></div>
        <div class="chai_bg-[#6f4e37] chai_h-4 chai_w-32 chai_rounded-sm"></div>
        <p class="chai_fs-sm chai_text-gray chai_mt-2">Demonstrating widths: 16px, 32px, 64px, 128px</p>
      </div>
    </section>

    <section class="chai_mb-12">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-6 chai_text-[#6f4e37]">03. Elevation & Shapes</h2>
      <div class="chai_flex chai_gap-6">
        <div class="chai_bg-white chai_p-8 chai_shadow-sm chai_rounded-sm chai_flex-1 chai_ta-center">
          Shadow SM / Round SM
        </div>
        <div class="chai_bg-white chai_p-8 chai_shadow-md chai_rounded-md chai_flex-1 chai_ta-center">
          Shadow MD / Round MD
        </div>
        <div class="chai_bg-white chai_p-8 chai_shadow-lg chai_rounded-lg chai_flex-1 chai_ta-center">
          Shadow LG / Round LG
        </div>
      </div>
    </section>

    <section class="chai_mb-12">
      <h2 class="chai_fs-lg chai_fw-bold chai_mb-4 chai_text-[#6f4e37]">04. Interaction & Arbitrary</h2>
      <div class="chai_flex chai_gap-4">
        <button class="chai_p-4 chai_bg-[#6f4e37] chai_text-white chai_rounded-md chai_fw-bold chai_shadow-md">
          Chai Button ☕
        </button>
        <button class="chai_p-4 chai_bg-white chai_text-[#6f4e37] chai_border-[2px] chai_borderc-[#6f4e37] chai_rounded-[12px]">
          Secondary Outline
        </button>
      </div>
    </section>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
